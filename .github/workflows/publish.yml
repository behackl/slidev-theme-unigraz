name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # bundles npm >= 11.5.1, required for trusted publishing
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no dependency caching in publish jobs (cache poisoning)
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm run build
      - run: npm publish --provenance --access public
